name: Auto Release

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r .version packages/opencode/package.json)
          NEW_VERSION="${VERSION}.1"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Current package.json version: $VERSION"
          echo "Target release version: $NEW_VERSION"
      
      - name: Check if release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: check
        run: |
          if gh release view ${{ steps.version.outputs.new_version }} 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.new_version }} already exists, skipping build."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.new_version }} not found, will build."
          fi
      
      - name: Build and Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./script-build/build-opencode.sh
          ./script-build/build-opencode.sh ${{ steps.version.outputs.new_version }}
